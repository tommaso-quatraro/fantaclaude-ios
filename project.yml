name: Fantaclaude
options:
  bundleIdPrefix: it.tommaso
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # indirizzo dell'app: arriva dalle variabili di GitHub Actions (FANTA_HOST, FANTA_PORT), non sta nel codice
    FANTA_HOST: "example.invalid"
    FANTA_PORT: "443"
targets:
  Fantaclaude:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.fantaclaude
        PRODUCT_NAME: Fantaclaude
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Fantaclaude
        CFBundleLocalizations:
          - it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # aggiornamento in background (BGAppRefreshTask): identificativo permesso e modalità "fetch"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - it.tommaso.fantaclaude.aggiorna
        FantaHost: $(FANTA_HOST)
        FantaPort: $(FANTA_PORT)
