name: Fantaclaude
options:
  bundleIdPrefix: it.tommaso
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # indirizzo dell'app: arriva dalle variabili di GitHub Actions (FANTA_HOST, FANTA_PORT), non sta nel codice
    FANTA_HOST: "example.invalid"
    FANTA_PORT: "443"
targets:
  Fantaclaude:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: FantaclaudeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.fantaclaude
        PRODUCT_NAME: Fantaclaude
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Fantaclaude
        CFBundleLocalizations:
          - it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # schema fantaclaude:// (per aprire l'app da una notifica ntfy con l'intestazione Click)
        CFBundleURLTypes:
          - CFBundleURLName: it.tommaso.fantaclaude
            CFBundleURLSchemes:
              - fantaclaude
        # aggiornamento in background (BGAppRefreshTask): identificativo permesso e modalità "fetch"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - it.tommaso.fantaclaude.aggiorna
        FantaHost: $(FANTA_HOST)
        FantaPort: $(FANTA_PORT)
  FantaclaudeWidget:
    # estensione widget (WidgetKit): conto alla rovescia, modulo e punti attesi. Consuma un App ID in più con l'Apple ID gratuito.
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
      - path: Sources/Domain/Modelli.swift
      - path: Sources/Domain/Quando.swift
      - path: Sources/Domain/Formato.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.fantaclaude.widget
        PRODUCT_NAME: FantaclaudeWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Fantaclaude
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FantaHost: $(FANTA_HOST)
        FantaPort: $(FANTA_PORT)
