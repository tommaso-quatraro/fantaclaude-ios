name: Fantaclaude
options:
  bundleIdPrefix: it.tommaso
  deploymentTarget:
    # 18: Tab, zoom, MeshGradient, sidebarAdaptable. Le funzioni di iOS 26 (Liquid Glass) sono protette da #available con un ripiego.
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: it
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # indirizzo dell'app: arriva dalle variabili di GitHub Actions (FANTA_HOST, FANTA_PORT), non sta nel codice
    FANTA_HOST: "example.invalid"
    FANTA_PORT: "443"
targets:
  Fantaclaude:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - target: FantaclaudeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.fantaclaude
        PRODUCT_NAME: Fantaclaude
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # icone alternative scelte in Lega > Icona dell'app (AppIcon-<colore> nell'asset catalog; il verde e' AppIcon)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-blu AppIcon-viola AppIcon-arancio AppIcon-rosso AppIcon-grafite"
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Undici
        CFBundleLocalizations:
          - it
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # schermata di avvio senza storyboard: verde campo con il marchio fermo (4-3-3 e capitano)
        UILaunchScreen:
          UIColorName: FondoLancio
          UIImageName: MarchioLancio
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # schema fantaclaude:// (per aprire l'app da una notifica ntfy con l'intestazione Click)
        CFBundleURLTypes:
          - CFBundleURLName: it.tommaso.fantaclaude
            CFBundleURLSchemes:
              - fantaclaude
        # aggiornamento in background (BGAppRefreshTask): identificativo permesso e modalità "fetch"
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - it.tommaso.fantaclaude.aggiorna
        FantaHost: $(FANTA_HOST)
        FantaPort: $(FANTA_PORT)
  FantaclaudeWidget:
    # estensione widget (WidgetKit): conto alla rovescia, modulo e punti attesi. Consuma un App ID in più con l'Apple ID gratuito.
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetSources
      - path: Sources/Domain/Modelli.swift
      - path: Sources/Domain/Quando.swift
      - path: Sources/Domain/Formato.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.fantaclaude.widget
        PRODUCT_NAME: FantaclaudeWidget
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Config/WidgetInfo.plist
      properties:
        CFBundleDisplayName: Undici
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        FantaHost: $(FANTA_HOST)
        FantaPort: $(FANTA_PORT)
  FantaclaudeTests:
    # test automatici (XCTest) di Domain, Data e ViewModel: girano nel simulatore (workflow test.yml). Non entrano nell'IPA.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FantaclaudeTests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Fantaclaude
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.fantaclaude.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  FantaclaudeUITests:
    # test di fumo dell'interfaccia (XCUITest) con l'app in modalità -DEMO
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FantaclaudeUITests
    dependencies:
      - target: Fantaclaude
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: it.tommaso.fantaclaude.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  Fantaclaude:
    # i test si costruiscono ed eseguono solo con "test": archive e build normali (ipa.yml, screenshot.yml) non li toccano
    build:
      targets:
        Fantaclaude: all
        FantaclaudeTests: [test]
        FantaclaudeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FantaclaudeTests
        - FantaclaudeUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
