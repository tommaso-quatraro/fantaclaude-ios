name: Compila IPA

# Compila l'app su un Mac di GitHub SENZA firma (la firma la fa SideStore sull'iPhone con l'Apple ID gratuito).
# L'indirizzo dell'app non sta nel codice: variabili del repository FANTA_HOST e FANTA_PORT (Settings > Secrets and variables > Actions > Variables).
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Immagine del Mac (prova: macos-26 per Xcode 26 e Liquid Glass; la release si crea solo con quella predefinita, macos-26; macos-15 resta come ripiego)"
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installa XcodeGen
        run: brew install xcodegen
      - name: Crea il progetto Xcode
        run: xcodegen generate
      - name: Compila (senza firma)
        env:
          FANTA_HOST: ${{ vars.FANTA_HOST }}
          FANTA_PORT: ${{ vars.FANTA_PORT }}
        run: |
          set -o pipefail
          xcodebuild -project Fantaclaude.xcodeproj -scheme Fantaclaude -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/Fantaclaude.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            FANTA_HOST="$FANTA_HOST" FANTA_PORT="$FANTA_PORT" 2>&1 | tee build.log | tail -n 40
      - name: Crea l'IPA
        run: |
          mkdir -p Payload
          cp -R build/Fantaclaude.xcarchive/Products/Applications/Fantaclaude.app Payload/
          zip -qry Fantaclaude.ipa Payload
          ls -la Fantaclaude.ipa
          # l'estensione del widget deve stare dentro l'app (PlugIns), con il suo eseguibile
          ls -la Payload/Fantaclaude.app/PlugIns/FantaclaudeWidget.appex
          test -f Payload/Fantaclaude.app/PlugIns/FantaclaudeWidget.appex/FantaclaudeWidget
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" Payload/Fantaclaude.app/PlugIns/FantaclaudeWidget.appex/Info.plist
          /usr/libexec/PlistBuddy -c "Print :FantaHost" Payload/Fantaclaude.app/Info.plist | sed 's/./*/g'   # solo per controllare che non sia vuoto
          # le icone alternative (Lega > Icona dell'app) devono essere dichiarate nell'Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundleAlternateIcons" Payload/Fantaclaude.app/Info.plist | head -n 20
          # i target di test non devono finire nell'IPA
          ! ls Payload/Fantaclaude.app/PlugIns | grep -i test
      - uses: actions/upload-artifact@v4
        with:
          name: Fantaclaude-ipa
          path: Fantaclaude.ipa
          retention-days: 30
      - name: Pubblica come release (da scaricare dall'iPhone)
        if: github.ref == 'refs/heads/main' && (inputs.runner || 'macos-26') == 'macos-26'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Fantaclaude.ipa --title "Build ${{ github.run_number }}" --notes "IPA non firmato, da installare con SideStore." --repo "$GITHUB_REPOSITORY"
      - name: Log in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilazione
          path: build.log
